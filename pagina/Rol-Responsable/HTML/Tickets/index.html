<!DOCTYPE html>
</html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA</title>
    <link rel="stylesheet" href="../style/Activo.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
    <div class="logo">SIGMA</div>
    <div class="top-bar">
        <button class="btn">+ Nuevo</button>
    </div>
    </header>

    <!-- Layout principal -->
    <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <ul>
        <li>General</li>
        <li class="active">Activos</li>
        <li>Tickets</li>
        <li>Mantenimiento</li>
        </ul>
        <div class="sidebar-profile">
        <img src="https://via.placeholder.com/40" alt="Foto perfil">
        <div class="profile-info">
            <strong>Alex Morgan</strong>
            <span>Admin</span>
        </div>
        </div>
    </aside>

    <!-- Contenido principal -->
    <body>
        <div class="card">
            <h2>Activos</h2>
            <div class="toolbar">
            <input type="text" placeholder="Buscar Activo">
            <button>📦 Categoria</button>
            <button>✔️ Estado</button>
            <button>📅 Fecha</button>
            <button>⇅ Ordenar</button>
            </div>
        
            <table>
            <thead>
                <tr>
                <th>Nombre</th>
                <th>Categoria</th>
                <th>Serial</th>
                <th>Estado</th>
                <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                <td>MacBook Pro 16”</td>
                <td>Laptop</td>
                <td>5CD9312XYZ</td>
                <td><span class="status active">Activo</span></td>
                <td>
                    <button class="btn btn-edit">Modificar</button>
                    <button class="btn btn-view">Detalles</button>
                    <button class="btn btn-delete">Eliminar</button>
                </td>
                </tr>
                <tr>
                <td>Laptop HP</td>
                <td>Mantenimiento</td>
                <td>9F2ABC3</td>
                <td><span class="status maintenance">mantenimiento</span></td>
                <td>
                    <button class="btn btn-edit">Modificar</button>
                    <button class="btn btn-view">Detalles</button>
                    <button class="btn btn-delete">Eliminar</button>
                </td>
                </tr>
                <tr>
                <td>Samsung</td>
                <td>Inactivo</td>
                <td>RF8M82X2P4X</td>
                <td><span class="status inactive">Inactivo</span></td>
                <td>
                    <button class="btn btn-edit">Modificar</button>
                    <button class="btn btn-view">Detalles</button>
                    <button class="btn btn-delete">Eliminar</button>
                </td>
                </tr>
            </tbody>
            </table>
        </div>
        </body>
        </html>
</body>
</html>
