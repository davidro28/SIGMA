<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Sigma</title>
  <link rel="stylesheet" href="../Login/index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Font Awesome para los íconos -->
  <script src="https://kit.fontawesome.com/4ad8f3dbef.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <div class="logo-icon">Σ</div>
        <span class="logo-text">Sigma</span>
      </div>

      <h2>Inicia sesión</h2>
      <p class="subtitle">Accede a tu panel de control para gestionar tus activos.</p>

      <form>
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" placeholder="Correo electrónico" required />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input id="password" type="password" placeholder="Contraseña" required />
          <i id="togglePassword" class="fa-solid fa-eye"></i>
        </div>

        <div class="options">
          <label><input type="checkbox" /> Recordarme</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button class="btn-primary" type="submit">Entrar en Sigma</button>

        <div class="divider">
          <span>o continuar con</span>
        </div>

        <button type="button" class="btn-google">
  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" />
  Google
</button>

        <p class="register-text">
          ¿No tienes cuenta? <a href="#">Crear cuenta</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.classList.toggle("fa-eye");
      togglePassword.classList.toggle("fa-eye-slash");
    });
  </script>
</body>
</html>
