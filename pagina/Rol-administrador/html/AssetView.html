<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista de activo</title>
  <link rel="stylesheet" href="../style/AssetView.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Detalle del Activo</h1>
      
      <div class="field">
        <span class="label">Nombre:</span>
        <span class="value">Laptop Dell XPS 13</span>
      </div>
      
      <div class="field">
        <span class="label">Categoría:</span>
        <span class="value">Computadores</span>
      </div>
      
      <div class="field">
        <span class="label">Estado:</span>
        <span class="value status available">Disponible</span>
      </div>
      
      <button class="btn">Editar</button>
    </div>
  </div>
</body>
</html>
