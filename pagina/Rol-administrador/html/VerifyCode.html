<!DOCTYPE html>

  <title>Verificación de código</title>

</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Verificar Código</h1>

      <div class="code-inputs">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
      </div>

      <button class="btn">Verificar</button>
      <p class="resend">¿No recibiste el código? <a href="#">Reenviar</a></p>
    </div>
  </div>
</body>
</html>
