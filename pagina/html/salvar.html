<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar guardado</title>
  <link rel="stylesheet" href="../style/salvar.css">
</head>
<body>
  <div class="overlay">
    <div class="modal">
      <h2>¿Guardar cambios?</h2>
      <p>Estás a punto de guardar la información editada.  
      ¿Deseas continuar?</p>

      <div class="actions">
        <button class="btn cancel">Cancelar</button>
        <button class="btn confirm">Guardar</button>
      </div>
    </div>
  </div>
</body>
</html>
